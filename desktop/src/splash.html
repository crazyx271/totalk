<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>ToTalk</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111216;
        overflow: hidden;
        -webkit-app-region: drag;
      }
      body {
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: linear-gradient(145deg, #9688ff, #6958df);
        box-shadow: 0 18px 45px #6d5ce866;
        font-size: 34px;
        font-weight: 900;
        color: #fff;
        animation: pulse 1.6s ease-in-out infinite;
      }
      .status {
        color: #9a9cac;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 18px 45px #6d5ce866; }
        50% { transform: scale(1.06); box-shadow: 0 22px 55px #6d5ce899; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">T</div>
      <div class="status">Запуск…</div>
    </div>
  </body>
</html>
